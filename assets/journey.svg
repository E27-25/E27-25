<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="t d"><title id="t">Journey</title><desc id="d">Timeline 2023 to 2026: KMITL B.Sc.; KBTG and Bot and Life internships; Super AI Engineer silver medal; teaching assistant roles at AIAT, DGA and KMITL; three hackathon wins including the BDI Royal Cup; six accepted papers; AI Engineer Intern at Asia Energy Tech; Musashino University integrated program.</desc><defs><linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#4568dc"/><stop offset=".25" stop-color="#b06ab3"/><stop offset=".5" stop-color="#fc00ff"/><stop offset=".75" stop-color="#00dbde"/><stop offset="1" stop-color="#4568dc"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="6s" repeatCount="indefinite"/></linearGradient><linearGradient id="vflow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="540" spreadMethod="repeat"><stop offset="0" stop-color="#4568dc"/><stop offset=".25" stop-color="#b06ab3"/><stop offset=".5" stop-color="#fc00ff"/><stop offset=".75" stop-color="#00dbde"/><stop offset="1" stop-color="#4568dc"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="0 540" dur="4s" repeatCount="indefinite"/></linearGradient><linearGradient id="yg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00dbde"/><stop offset="1" stop-color="#fc00ff"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter></defs><style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Ubuntu, Arial, sans-serif}.yr{font-size:26px;font-weight:700}.b{font-size:15px;font-weight:600;fill:#e6edf3}.m{font-size:15px;fill:#9da7b3}.draw{stroke-dasharray:500;stroke-dashoffset:0;animation:draw 1.8s cubic-bezier(.3,.7,.3,1) .1s both}@keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}.card{animation:slide .9s cubic-bezier(.2,.8,.2,1) both}@keyframes slide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}.comet{animation:comet 5s linear infinite}@keyframes comet{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(500px);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}.now{animation:blink 1.6s ease-in-out infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><line class="draw" x1="130" y1="20" x2="130" y2="520" stroke="url(#vflow)" stroke-width="3" stroke-linecap="round"/><g transform="translate(130,20)"><g class="comet"><circle r="9" fill="#fc00ff" opacity=".55" filter="url(#glow)"/><circle r="3.2" fill="#fff"/></g></g><text class="yr" x="106" y="66.0" text-anchor="end" fill="url(#yg)">2023</text><line x1="138" y1="57.0" x2="160" y2="57.0" stroke="#30363d" stroke-width="2"/><circle class="ring" style="animation-delay:0.0s" cx="130" cy="57.0" r="7" fill="none" stroke="#b06ab3" stroke-width="2"/><circle cx="130" cy="57.0" r="7" fill="#0d1117" stroke="url(#flow)" stroke-width="3"/><g transform="translate(160,20)"><g class="card" style="animation-delay:0.35s"><rect x=".75" y=".75" width="718.5" height="72.5" rx="14" fill="#0d1117" stroke="url(#flow)" stroke-width="1.5"/><circle cx="22" cy="25" r="3" fill="url(#flow)"/><text x="34" y="30"><tspan class="b">B.Sc. Information Technology</tspan><tspan class="m"> · Data Science &amp; Business Analytics, KMITL</tspan></text><circle cx="22" cy="49" r="3" fill="url(#flow)"/><text x="34" y="54"><tspan class="b">1st Runner-Up</tspan><tspan class="m"> · Innovation for Crime Combating (I4C)</tspan></text></g></g><text class="yr" x="106" y="184.0" text-anchor="end" fill="url(#yg)">2024