tspan class="b">AI Engineer (Part-Time)</tspan><tspan class="m"> · Bot and Life</tspan></text><circle cx="22" cy="73" r="3" fill="url(#flow)"/><text x="34" y="78"><tspan class="b">Winner ×3</tspan><tspan class="m"> · BDI Hackathon (Royal Cup) · ExxonMobil · Krungsri</tspan></text><circle cx="22" cy="97" r="3" fill="url(#flow)"/><text x="34" y="102"><tspan class="b">2nd Runner-Up ×2</tspan><tspan class="m"> · AI Thailand Hackathon · Huawei ICT Competition</tspan></text></g></g><text class="yr" x="106" y="468.0" text-anchor="end" fill="url(#yg)">2026</text><line x1="138" y1="459.0" x2="160" y2="459.0" stroke="#30363d" stroke-width="2"/><circle class="ring" style="animation-delay:1.8s" cx="130" cy="459.0" r="7" fill="none" stroke="#b06ab3" stroke-width="2"/><circle cx="130" cy="459.0" r="7" fill="#0d1117" stroke="url(#flow)" stroke-width="3"/><g transform="translate(160,398)"><g class="card" style="animation-delay:1.19s"><rect x=".75" y=".75" width="718.5" height="120.5" rx="14" fill="#0d1117" stroke="url(#flow)" stroke-width="1.5"/><circle cx="22" cy="25" r="3" fill="url(#flow)"/><text x="34" y="30"><tspan class="b">6 papers accepted</tspan><tspan class="m"> · ITC-CSCC, IBDAP, JCSSE, BMEiCON, ICITEE, ICONIP</tspan></text><circle cx="22" cy="49" r="3" fill="url(#flow)"/><text x="34" y="54"><tspan class="b">Teaching Assistant</tspan><tspan class="m"> · DGA e-Government Program · KMITL DSBA8 · AIAT S6</tspan></text><circle cx="22" cy="73" r="3" fill="url(#flow)"/><text x="34" y="78"><tspan class="b">AI Engineer Intern</tspan><tspan class="m"> · Asia Energy Tech (AET)</tspan></text><circle cx="22" cy="97" r="3" fill="url(#flow)"/><text x="34" y="102"><tspan class="b">Integrated Undergraduate–Master’s Program</tspan><tspan class="m"> · Musashino University, Tokyo</tspan></text><g class="now"><rect x="650" y="12" width="54" height="22" rx="11" fill="url(#yg)"/><text x="677" y="27.5" text-anchor="middle" style="font-size:12px;font-weight:700;letter-spacing:1px" fill="#fff">N