<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16" role="img" aria-label="divider"><defs><linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#4568dc"/><stop offset=".25" stop-color="#b06ab3"/><stop offset=".5" stop-color="#fc00ff"/><stop offset=".75" stop-color="#00dbde"/><stop offset="1" stop-color="#4568dc"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="5s" repeatCount="indefinite"/></linearGradient><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter></defs><style>.spark{animation:sweep 4.5s cubic-bezier(.45,0,.55,1) infinite}@keyframes sweep{0%{transform:translateX(-30px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(930px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="7" width="900" height="2" rx="1" fill="url(#flow)"/><g class="spark"><circle cx="0" cy="8" r="7" fill="#fc00ff" opacity=".7" filter="url(#glow)"/><circle cx="0" cy="8" r="2.4" fill="#fff"/></g></svg>
